<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diário Alimentar">
<title>Diário Alimentar</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#f5f2ee;font-family:'Crimson Pro',Georgia,serif;min-height:100vh;}
  input,textarea{font-family:'Crimson Pro',Georgia,serif;}
  input:focus,textarea:focus{outline:none;border-color:#3d7a6e!important;box-shadow:0 0 0 2px rgba(61,122,110,0.12);}
  input[type=time]{color-scheme:light;}
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px;}
  @keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-14px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  #header{background:#3d7a6e;padding:20px 20px 16px;position:sticky;top:0;z-index:10;}
  #header-inner{max-width:480px;margin:0 auto;}
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .header-sub{font-size:11px;color:rgba(255,255,255,0.65);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
  .header-title{font-size:24px;color:#fff;font-weight:600;margin-bottom:12px;}
  .bell-btn{background:rgba(255,255,255,0.15);border:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:18px;margin-top:4px;position:relative;}
  .bell-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:#f5c842;border-radius:50%;border:2px solid #3d7a6e;}
  .tabs{display:flex;gap:8px;}
  .tab{padding:6px 14px;border-radius:20px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'Crimson Pro',serif;transition:all 0.15s;}
  .tab.active{background:#fff;color:#3d7a6e;}
  .tab.inactive{background:rgba(255,255,255,0.2);color:#fff;}

  #content{max-width:480px;margin:0 auto;padding:16px 16px 100px;}

  .day-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid #ede9e3;}
  .day-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .day-date{font-size:18px;font-weight:600;color:#2a2a2a;}
  .day-weekday{font-size:13px;color:#8a8a8a;}
  .day-emoji{font-size:28px;}
  .day-fields{display:flex;gap:12px;}
  .day-fields>div{flex:1;}

  label.lbl{font-size:11px;color:#8a8a8a;display:block;margin-bottom:4px;letter-spacing:0.5px;}
  input.inp,textarea.inp{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ddd9d3;background:#faf9f7;font-size:13px;color:#2a2a2a;}
  textarea.inp{resize:vertical;}

  .next-alarm{background:rgba(61,122,110,0.07);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .next-alarm-emoji{font-size:18px;}
  .next-alarm-text{flex:1;font-size:13px;color:#3d7a6e;font-weight:600;}
  .next-alarm-sub{font-size:12px;color:#8a8a8a;font-weight:400;}

  .meal-list{display:flex;flex-direction:column;gap:10px;}
  .meal-card{background:#fff;border-radius:12px;border:1px solid #ede9e3;overflow:hidden;transition:box-shadow 0.2s;}
  .meal-card.open{box-shadow:0 4px 20px rgba(0,0,0,0.08);}
  .meal-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;}
  .meal-header.open{background:#f5f2ee;}
  .meal-time-badge{width:36px;height:36px;border-radius:50%;background:#3d7a6e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:monospace;flex-shrink:0;}
  .meal-info{flex:1;min-width:0;}
  .meal-name{font-size:14px;font-weight:600;color:#2a2a2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meal-name.empty{color:#bbb;font-style:italic;}
  .meal-meta{display:flex;gap:8px;margin-top:2px;}
  .meal-meta span{font-size:11px;color:#8a8a8a;}
  .meal-chevron{font-size:18px;color:#bbb;transition:transform 0.2s;}
  .meal-chevron.open{transform:rotate(180deg);}
  .meal-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;animation:fadeIn 0.15s;}
  .meal-body hr{border:none;border-top:1px solid #ede9e3;margin-bottom:2px;}
  .two-col{display:flex;gap:10px;}
  .two-col>div{flex:1;}
  .del-btn{background:none;border:1px solid #f0d0d0;color:#c97a7a;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;align-self:flex-end;font-family:'Crimson Pro',serif;}

  .scale-wrap{display:flex;flex-direction:column;gap:4px;}
  .scale-dots{display:flex;gap:3px;align-items:center;flex-wrap:wrap;}
  .dot{width:22px;height:22px;border-radius:50%;border:none;font-size:9px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:monospace;}
  .dot.off{background:#e8e4df;color:#aaa;}
  .dot.active{transform:scale(1.2);}

  .empty-msg{text-align:center;padding:40px 20px;color:#bbb;font-size:15px;font-style:italic;}

  .hist-item{background:#fff;border-radius:12px;padding:14px 16px;border:1px solid #ede9e3;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .hist-date{font-weight:600;font-size:15px;color:#2a2a2a;}
  .hist-weekday{font-size:12px;color:#8a8a8a;}
  .hist-badge{background:#3d7a6e;color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;}
  .hist-af{font-size:11px;color:#8a8a8a;}
  .hist-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}

  .fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;}
  .fab button{background:#3d7a6e;color:#fff;border:none;border-radius:28px;padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(61,122,110,0.4);font-family:'Crimson Pro',serif;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:transform 0.1s;}
  .fab button:active{transform:scale(0.96);}

  /* Banner de alarme */
  #alarm-banner{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;width:calc(100% - 32px);max-width:440px;background:#3d7a6e;border-radius:16px;padding:14px 18px;box-shadow:0 8px 32px rgba(61,122,110,0.45);display:none;align-items:center;gap:12px;animation:slideDown 0.3s ease;}
  #alarm-banner.show{display:flex;}
  .alarm-emoji{font-size:28px;}
  .alarm-info{flex:1;}
  .alarm-title{color:#fff;font-weight:600;font-size:15px;}
  .alarm-sub{color:rgba(255,255,255,0.75);font-size:12px;}
  .alarm-btns{display:flex;flex-direction:column;gap:6px;}
  .alarm-ok{background:#fff;color:#3d7a6e;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Crimson Pro',serif;white-space:nowrap;}
  .alarm-dismiss{background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Crimson Pro',serif;}

  /* Painel de alarmes */
  #alarm-panel{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:150;display:none;align-items:flex-end;justify-content:center;}
  #alarm-panel.show{display:flex;}
  .alarm-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:24px 20px 40px;}
  .alarm-sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .alarm-sheet-title{font-size:18px;font-weight:600;color:#2a2a2a;}
  .alarm-sheet-sub{font-size:12px;color:#8a8a8a;margin-top:2px;}
  .alarm-close{background:none;border:none;font-size:22px;cursor:pointer;color:#aaa;}
  .perm-warning{background:#fff8ec;border:1px solid #f5d87a;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#7a5c00;}
  .perm-link{text-decoration:underline;cursor:pointer;font-weight:600;}
  .alarm-row{display:flex;align-items:center;gap:12px;padding:12px 0;}
  .alarm-row:not(:last-child){border-bottom:1px solid #f0ece6;}
  .alarm-row-emoji{font-size:22px;width:32px;text-align:center;}
  .alarm-row-info{flex:1;}
  .alarm-row-name{font-size:14px;font-weight:600;color:#2a2a2a;}
  .toggle{width:44px;height:24px;border-radius:12px;position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;}
  .toggle-knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left 0.2s;box-shadow:0 1px 4px rgba(0,0,0,0.2);}

  /* Botão exportar */
  .export-btn{display:flex;align-items:center;gap:8px;background:none;border:1.5px solid #3d7a6e;color:#3d7a6e;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Crimson Pro',serif;transition:all 0.15s;margin:0 auto 4px;}
  .export-btn:active{background:#3d7a6e;color:#fff;}
</style>
</head>
<body>

<!-- Banner de alarme -->
<div id="alarm-banner">
  <span class="alarm-emoji" id="alarm-emoji">🍽️</span>
  <div class="alarm-info">
    <div class="alarm-title" id="alarm-title">Almoço</div>
    <div class="alarm-sub">Hora de registrar sua refeição</div>
  </div>
  <div class="alarm-btns">
    <button class="alarm-ok" onclick="alarmeRegistrar()">Registrar</button>
    <button class="alarm-dismiss" onclick="alarmeDismiss()">Depois</button>
  </div>
</div>

<!-- Painel de alarmes -->
<div id="alarm-panel" onclick="fecharPainel(event)">
  <div class="alarm-sheet">
    <div class="alarm-sheet-header">
      <div>
        <div class="alarm-sheet-title">🔔 Lembretes</div>
        <div class="alarm-sheet-sub">Notificação no horário configurado</div>
      </div>
      <button class="alarm-close" onclick="document.getElementById('alarm-panel').classList.remove('show')">✕</button>
    </div>
    <div id="perm-warning" style="display:none" class="perm-warning">
      <strong>Permissão necessária</strong> para notificações.
      <span class="perm-link" onclick="pedirPermissao()">Ativar agora</span>
    </div>
    <div id="alarm-rows"></div>
  </div>
</div>

<!-- Header -->
<div id="header">
  <div id="header-inner">
    <div class="header-top">
      <div>
        <div class="header-sub">Método Sophie Deran</div>
        <div class="header-title">Diário Alimentar</div>
      </div>
      <button class="bell-btn" onclick="abrirPainel()" id="bell-btn">
        🔔<span class="bell-dot" id="bell-dot"></span>
      </button>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-hoje" onclick="mudarAba('hoje')">Hoje</button>
      <button class="tab inactive" id="tab-historico" onclick="mudarAba('historico')">Histórico</button>
    </div>
  </div>
</div>

<div id="content"></div>

<div class="fab" id="fab">
  <button onclick="adicionarRefeicao()"><span style="font-size:20px">+</span> Registrar refeição</button>
</div>

<script>
const STORAGE_KEY = 'diario-sophie-deran';
const ALARMES_KEY = 'diario-sophie-deran-alarmes';
const DIAS_SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const REFEICOES_PADRAO = [
  {nome:'Café da manhã', horario:'09:00', emoji:'☕'},
  {nome:'Almoço',        horario:'14:00', emoji:'🍽️'},
  {nome:'Lanche',        horario:'16:00', emoji:'🍎'},
  {nome:'Jantar',        horario:'19:00', emoji:'🌙'},
];

let dias = {};
let alarmes = REFEICOES_PADRAO.map(r=>({...r, ativo:true}));
let abaAtiva = 'hoje';
let diaAtivo = hoje();
let disparados = new Set();
let alarmePendente = null;
let permissao = 'default';

function hoje() {
  return new Date().toISOString().split('T')[0];
}
function hojeFormatado() {
  return new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function diaSemanaHoje() {
  return DIAS_SEMANA[new Date().getDay()];
}
function horaAgora() {
  return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function novoDia(data) {
  return {data, diaSemana:DIAS_SEMANA[new Date(data+'T12:00:00').getDay()], atividadeFisica:'', sono:null, refeicoes:[]};
}
function novaRefeicao() {
  return {id:Date.now(), horario:horaAgora(), alimentos:'', onde:'', comQuem:'', fome:null, saciedade:null, saciacao:null, satisfacao:null, observacoes:''};
}
function getDia(data) {
  if (!dias[data]) dias[data] = novoDia(data);
  return dias[data];
}
function salvar() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(dias)); } catch(e){}
  try { localStorage.setItem(ALARMES_KEY, JSON.stringify(alarmes)); } catch(e){}
}
function carregar() {
  try { const r = localStorage.getItem(STORAGE_KEY); if(r) dias = JSON.parse(r); } catch(e){}
  try { const r = localStorage.getItem(ALARMES_KEY); if(r) alarmes = JSON.parse(r); } catch(e){}
  if ('Notification' in window) permissao = Notification.permission;
}

// Som
function tocarSom() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [[523,0],[659,0.18],[784,0.36]].forEach(([freq,t])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=freq; o.type='sine';
      g.gain.setValueAtTime(0,ctx.currentTime+t);
      g.gain.linearRampToValueAtTime(0.18,ctx.currentTime+t+0.05);
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+t+0.3);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.35);
    });
  } catch(e){}
}

// Verificar alarmes
function checkAlarmes() {
  const agora = new Date();
  const hhmm = agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const chave = hoje()+'-'+hhmm;
  alarmes.forEach(a => {
    if (!a.ativo) return;
    if (a.horario !== hhmm) return;
    const k = chave+a.nome;
    if (disparados.has(k)) return;
    disparados.add(k);
    alarmePendente = a;
    tocarSom();
    mostrarBanner(a);
    if (permissao==='granted') {
      try { new Notification(a.emoji+' '+a.nome,{body:'Hora de registrar sua refeição!'}); } catch(e){}
    }
  });
}
setInterval(checkAlarmes, 30000);

function mostrarBanner(a) {
  document.getElementById('alarm-emoji').textContent = a.emoji;
  document.getElementById('alarm-title').textContent = a.nome;
  document.getElementById('alarm-banner').classList.add('show');
}
function alarmeDismiss() {
  document.getElementById('alarm-banner').classList.remove('show');
}
function alarmePendente_ref() { return alarmePendente; }
function alarmRegistrar() {
  alarmeDismiss();
  mudarAba('hoje');
  diaAtivo = hoje();
  adicionarRefeicao();
}
function alarmRegistrar2() { alarmRegistrar(); }

// Sobrescrever o onclick do botão Registrar do banner
function alarmRegistrarWrapper() {
  document.getElementById('alarm-banner').classList.remove('show');
  mudarAba('hoje');
  diaAtivo = hoje();
  adicionarRefeicao();
}
document.querySelector('.alarm-ok').onclick = alarmRegistrarWrapper;

// Permissão
async function pedirPermissao() {
  if (!('Notification' in window)) return;
  const r = await Notification.requestPermission();
  permissao = r;
  renderPainel();
}

// Painel de alarmes
function abrirPainel() {
  renderPainel();
  document.getElementById('alarm-panel').classList.add('show');
}
function fecharPainel(e) {
  if (e.target === document.getElementById('alarm-panel'))
    document.getElementById('alarm-panel').classList.remove('show');
}
function renderPainel() {
  const w = document.getElementById('perm-warning');
  w.style.display = permissao !== 'granted' ? 'block' : 'none';
  const rows = document.getElementById('alarm-rows');
  rows.innerHTML = '';
  alarmes.forEach((a,i) => {
    const div = document.createElement('div');
    div.className = 'alarm-row';
    div.innerHTML = `
      <span class="alarm-row-emoji">${a.emoji}</span>
      <div class="alarm-row-info">
        <div class="alarm-row-name">${a.nome}</div>
        <input type="time" value="${a.horario}" ${!a.ativo?'disabled':''} 
          style="margin-top:4px;padding:4px 8px;border-radius:8px;border:1px solid #ddd9d3;background:#faf9f7;font-size:13px;opacity:${a.ativo?1:0.4}"
          onchange="alarmes[${i}].horario=this.value;salvar();">
      </div>
      <div class="toggle" id="toggle-${i}" style="background:${a.ativo?'#3d7a6e':'#ddd'}" onclick="toggleAlarme(${i})">
        <div class="toggle-knob" style="left:${a.ativo?22:3}px"></div>
      </div>
    `;
    rows.appendChild(div);
  });
  // Bell dot
  document.getElementById('bell-dot').style.display = alarmes.some(a=>a.ativo) ? 'block':'none';
}
function toggleAlarme(i) {
  alarmes[i].ativo = !alarmes[i].ativo;
  salvar();
  renderPainel();
}

// Próximo alarme
function proximoAlarme() {
  const agora = new Date();
  const agoraMin = agora.getHours()*60 + agora.getMinutes();
  const lista = alarmes.filter(a=>a.ativo).map(a => {
    const [h,m] = a.horario.split(':').map(Number);
    return {...a, totalMin: h*60+m};
  }).filter(a => a.totalMin > agoraMin).sort((a,b)=>a.totalMin-b.totalMin);
  return lista[0] || null;
}

// Escala
function renderEscala(refId, campo, cor, label) {
  const vals = {fome:'#e07b4f',saciedade:'#3d7a6e',saciacao:'#5b8dc7',satisfacao:'#9b6dbd'};
  const emoji = v => !v?'':v<=3?'🌑':v<=6?'🌓':v<=8?'🌕':'✨';
  const r = getDia(diaAtivo).refeicoes.find(r=>r.id===refId);
  const val = r ? r[campo] : null;
  let html = `<div class="scale-wrap"><span class="lbl">${label}</span><div class="scale-dots">`;
  for (let n=1;n<=10;n++) {
    const on = val >= n;
    html += `<button class="dot ${on?'':'off'}" 
      style="${on?`background:${cor||vals[campo]};color:#fff`:''}${val===n?';transform:scale(1.2)':''}"
      onclick="setEscala(${refId},'${campo}',${n})">${n}</button>`;
  }
  html += `<span style="font-size:14px;margin-left:4px">${emoji(val)}</span></div></div>`;
  return html;
}
function setEscala(refId, campo, val) {
  const dia = getDia(diaAtivo);
  const r = dia.refeicoes.find(r=>r.id===refId);
  if (r) { r[campo]=val; salvar(); renderContent(); }
}

// CRUD
function adicionarRefeicao() {
  const dia = getDia(diaAtivo);
  dia.refeicoes.push(novaRefeicao());
  salvar();
  renderContent();
  // Expandir o último card depois de renderizar
  setTimeout(()=>{
    const cards = document.querySelectorAll('.meal-card');
    if (cards.length) {
      const last = cards[cards.length-1];
      const body = last.querySelector('.meal-body');
      if (body) { last.classList.add('open'); last.querySelector('.meal-header').classList.add('open'); last.querySelector('.meal-chevron').classList.add('open'); }
    }
  }, 50);
}
function excluirRefeicao(id) {
  const dia = getDia(diaAtivo);
  dia.refeicoes = dia.refeicoes.filter(r=>r.id!==id);
  salvar(); renderContent();
}
function updateRefeicao(id, campo, val) {
  const r = getDia(diaAtivo).refeicoes.find(r=>r.id===id);
  if (r) { r[campo]=val; salvar(); }
}
function updateDia(campo, val) {
  getDia(diaAtivo)[campo] = val;
  salvar();
}
function updateSono(val) {
  getDia(diaAtivo).sono = val;
  salvar();
  renderContent();
}

// Toggle card
function toggleCard(id) {
  const card = document.getElementById('card-'+id);
  const body = document.getElementById('body-'+id);
  const hdr  = document.getElementById('hdr-'+id);
  const chev = document.getElementById('chev-'+id);
  const aberto = card.classList.contains('open');
  if (aberto) {
    card.classList.remove('open'); body.style.display='none';
    hdr.classList.remove('open'); chev.classList.remove('open');
  } else {
    card.classList.add('open'); body.style.display='flex';
    hdr.classList.add('open'); chev.classList.add('open');
  }
}

// Render principal
function renderContent() {
  const cont = document.getElementById('content');
  if (abaAtiva === 'hoje') {
    renderHoje(cont);
    document.getElementById('fab').style.display = 'block';
  } else {
    renderHistorico(cont);
    document.getElementById('fab').style.display = 'none';
  }
}

function renderHoje(cont) {
  const dia = getDia(diaAtivo);
  const prox = proximoAlarme();
  let proxHtml = '';
  if (prox) {
    const [h,m] = prox.horario.split(':').map(Number);
    const agora = new Date(); const agoraMin = agora.getHours()*60+agora.getMinutes();
    const diff = h*60+m - agoraMin;
    const label = diff<60?`em ${diff} min`:`em ${Math.floor(diff/60)}h${diff%60>0?String(diff%60).padStart(2,'0')+'min':''}`;
    proxHtml = `<div class="next-alarm">
      <span class="next-alarm-emoji">${prox.emoji}</span>
      <div class="next-alarm-text">${prox.nome} <span class="next-alarm-sub">às ${prox.horario} (${label})</span></div>
    </div>`;
  }

  // Escala de sono inline
  const sonoVal = dia.sono;
  let sonoHtml = '<div class="scale-dots" style="flex-wrap:wrap">';
  for(let n=1;n<=10;n++){
    const on = sonoVal>=n;
    sonoHtml += `<button class="dot ${on?'':'off'}"
      style="${on?'background:#7b6dbd;color:#fff':''}${sonoVal===n?';transform:scale(1.2)':''}"
      onclick="updateSono(${n})">${n}</button>`;
  }
  sonoHtml += '</div>';

  let refHtml = '';
  if (dia.refeicoes.length === 0) {
    refHtml = '<div class="empty-msg">Nenhuma refeição registrada hoje</div>';
  } else {
    dia.refeicoes.forEach(r => {
      const nomeDisp = r.alimentos ? r.alimentos.substring(0,40)+(r.alimentos.length>40?'…':'') : null;
      refHtml += `
      <div class="meal-card" id="card-${r.id}">
        <div class="meal-header" id="hdr-${r.id}" onclick="toggleCard(${r.id})">
          <div class="meal-time-badge">${r.horario||'--'}</div>
          <div class="meal-info">
            <div class="meal-name${nomeDisp?'':' empty'}">${nomeDisp||'sem descrição'}</div>
            <div class="meal-meta">
              ${r.fome?`<span>Fome ${r.fome}</span>`:''}
              ${r.saciedade?`<span>· Sacied. ${r.saciedade}</span>`:''}
              ${r.saciacao?`<span>· Saciaç. ${r.saciacao}</span>`:''}
            </div>
          </div>
          <span class="meal-chevron" id="chev-${r.id}">⌄</span>
        </div>
        <div class="meal-body" id="body-${r.id}" style="display:none">
          <hr>
          <div class="two-col">
            <div><label class="lbl">Horário</label>
              <input type="time" class="inp" value="${r.horario}" onchange="updateRefeicao(${r.id},'horario',this.value)"></div>
            <div><label class="lbl">Onde</label>
              <input class="inp" placeholder="ex: em casa" value="${r.onde}" oninput="updateRefeicao(${r.id},'onde',this.value)"></div>
          </div>
          <div><label class="lbl">Alimentos e Quantidade</label>
            <textarea class="inp" rows="3" placeholder="Descreva o que comeu..." oninput="updateRefeicao(${r.id},'alimentos',this.value);document.getElementById('hdr-${r.id}').querySelector('.meal-name').textContent=this.value.substring(0,40)||(this.value?this.value:'sem descrição')">${r.alimentos}</textarea></div>
          <div><label class="lbl">Com Quem</label>
            <input class="inp" placeholder="ex: sozinha, com a família..." value="${r.comQuem}" oninput="updateRefeicao(${r.id},'comQuem',this.value)"></div>
          ${renderEscala(r.id,'fome','#e07b4f','Fome (antes)')}
          ${renderEscala(r.id,'saciedade','#3d7a6e','Saciedade (durante)')}
          ${renderEscala(r.id,'saciacao','#5b8dc7','Saciação (depois)')}
          ${renderEscala(r.id,'satisfacao','#9b6dbd','Satisfação')}
          <div><label class="lbl">Observações</label>
            <textarea class="inp" rows="2" placeholder="Como estava se sentindo?" oninput="updateRefeicao(${r.id},'observacoes',this.value)">${r.observacoes}</textarea></div>
          <button class="del-btn" onclick="excluirRefeicao(${r.id})">Excluir refeição</button>
        </div>
      </div>`;
    });
  }

  cont.innerHTML = `
    <div class="day-card">
      <div class="day-header">
        <div><div class="day-date">${diaAtivo===hoje()?hojeFormatado():diaAtivo.split('-').reverse().join('/')}</div>
          <div class="day-weekday">${dia.diaSemana}</div></div>
        <div class="day-emoji">${dia.refeicoes.length>0?'📋':'📝'}</div>
      </div>
      <div class="day-fields">
        <div><label class="lbl">Atividade Física</label>
          <input class="inp" placeholder="ex: caminhada 20min" value="${dia.atividadeFisica}" oninput="updateDia('atividadeFisica',this.value)"></div>
        <div><label class="lbl">Sono (qualidade)</label>${sonoHtml}</div>
      </div>
    </div>
    ${proxHtml}
    <div class="meal-list">${refHtml}</div>
    ${dia.refeicoes.length > 0 ? `<div style="margin-top:20px;text-align:center">
      <button class="export-btn" onclick="exportarDia()">📄 Exportar dia para PDF</button>
    </div>` : ''}
  `;
}

function renderHistorico(cont) {
  const chaves = Object.keys(dias).sort((a,b)=>b.localeCompare(a));
  if (chaves.length===0) {
    cont.innerHTML = '<div class="empty-msg">Nenhum registro ainda</div>';
    return;
  }
  let html = '<div style="display:flex;flex-direction:column;gap:10px">';
  chaves.forEach(data => {
    const d = dias[data];
    const fmt = data.split('-').reverse().join('/');
    const diaSem = DIAS_SEMANA[new Date(data+'T12:00:00').getDay()];
    html += `<div class="hist-item" onclick="verDia('${data}')">
      <div><div class="hist-date">${fmt}</div><div class="hist-weekday">${diaSem}</div></div>
      <div class="hist-right">
        <span class="hist-badge">${d.refeicoes.length} refeição${d.refeicoes.length!==1?'ões':''}</span>
        ${d.atividadeFisica?`<span class="hist-af">🏃 ${d.atividadeFisica}</span>`:''}
      </div>
    </div>`;
  });
  html += '</div>';
  cont.innerHTML = html;
}

function verDia(data) {
  diaAtivo = data;
  mudarAba('hoje');
}

function mudarAba(aba) {
  abaAtiva = aba;
  if (aba==='hoje') diaAtivo = hoje();
  document.getElementById('tab-hoje').className = 'tab '+(aba==='hoje'?'active':'inactive');
  document.getElementById('tab-historico').className = 'tab '+(aba==='historico'?'active':'inactive');
  renderContent();
}

// Exportar dia como tabela para impressão/PDF
function exportarDia() {
  const dia = getDia(diaAtivo);
  const fmt = diaAtivo.split('-').reverse().join('/');
  const verde = '#3d7a6e';
  const verdeClaro = '#d4eae7';
  const cinza = '#f5f2ee';

  const linhasRef = dia.refeicoes.length > 0 ? dia.refeicoes.map(r => `
    <tr>
      <td>${r.horario||''}</td>
      <td style="text-align:center">${r.fome||''}</td>
      <td style="text-align:left">${(r.alimentos||'').replace(/\n/g,'<br>')}</td>
      <td>${r.onde||''}</td>
      <td>${r.comQuem||''}</td>
      <td style="text-align:center">${r.saciedade||''}</td>
      <td style="text-align:center">${r.saciacao||''}</td>
      <td style="text-align:center">${r.satisfacao||''}</td>
      <td style="text-align:left">${(r.observacoes||'').replace(/\n/g,'<br>')}</td>
    </tr>`).join('') : `<tr><td colspan="9" style="text-align:center;color:#aaa;font-style:italic;padding:20px">Nenhuma refeição registrada</td></tr>`;

  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
  <title>Diário Alimentar · ${fmt}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Crimson Pro',Georgia,serif;background:#fff;padding:24px;color:#222;}
    h1{background:${verde};color:#fff;text-align:center;padding:12px;border-radius:6px 6px 0 0;font-size:18px;letter-spacing:1px;}
    .meta{display:flex;gap:0;border:1px solid #ccc;border-top:none;margin-bottom:12px;}
    .meta-cell{flex:1;padding:8px 12px;border-right:1px solid #ccc;font-size:13px;}
    .meta-cell:last-child{border-right:none;}
    .meta-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:2px;}
    .meta-val{font-weight:600;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    thead tr:first-child th{background:${verde};color:#fff;padding:8px 6px;text-align:center;font-size:11px;font-weight:600;}
    thead tr:last-child th{background:${verdeClaro};color:#555;padding:4px 6px;text-align:center;font-size:10px;}
    tbody tr:nth-child(even){background:${cinza};}
    tbody tr:nth-child(odd){background:#fff;}
    tbody td{padding:10px 6px;border:1px solid #ddd;vertical-align:top;font-size:12px;}
    tbody td:nth-child(3),tbody td:nth-child(9){text-align:left;min-width:80px;}
    .footer{margin-top:16px;text-align:center;font-size:10px;color:#aaa;}
    @media print{body{padding:10px;}@page{margin:1.5cm;size:A4 landscape;}}
  </style></head><body>
  <h1>Diário Alimentar · Método Sophie Deran</h1>
  <div class="meta">
    <div class="meta-cell"><span class="meta-label">Data</span><span class="meta-val">${fmt}</span></div>
    <div class="meta-cell"><span class="meta-label">Dia da semana</span><span class="meta-val">${dia.diaSemana}</span></div>
    <div class="meta-cell"><span class="meta-label">Atividade Física</span><span class="meta-val">${dia.atividadeFisica||'—'}</span></div>
    <div class="meta-cell"><span class="meta-label">Sono</span><span class="meta-val">${dia.sono ? dia.sono+'/10' : '—'}</span></div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Horário</th><th>Fome<br>(antes)</th><th>Alimentos e Quantidade</th>
        <th>Onde</th><th>Com Quem</th><th>Saciedade<br>(durante)</th>
        <th>Saciação<br>(depois)</th><th>Satisfação</th><th>Observações</th>
      </tr>
      <tr>
        <th></th><th style="font-size:9px;color:#777">1 – 10</th><th></th>
        <th></th><th></th><th style="font-size:9px;color:#777">1 – 10</th>
        <th style="font-size:9px;color:#777">1 – 10</th><th style="font-size:9px;color:#777">1 – 10</th><th></th>
      </tr>
    </thead>
    <tbody>${linhasRef}</tbody>
  </table>
  <div class="footer">Método Sophie Deran · gerado em ${new Date().toLocaleDateString('pt-BR')}</div>
  <script>window.onload=()=>{window.print();}<\/script>
  </body></html>`;

  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

// Init
carregar();
renderContent();
checkAlarmes();
</script>
