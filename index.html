<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diário Alimentar">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Diário Alimentar</title>
<style>
  :root {
    --sage:       #4E7F6B;
    --sage-light: #EEF3EF;
    --sage-mid:   #C5D9D0;
    --ink:        #1C1C1E;
    --muted:      #6C6C70;
    --line:       #D1D5D2;
    --bg:         #F9FAF9;
    --white:      #FFFFFF;
    --red:        #C0392B;
    --radius:     10px;
    --font:       -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 90px;
  }
  header {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 16px 20px 12px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  header p  { font-size: 13px; color: var(--muted); margin-top: 2px; }
  #day-nav {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    position: relative;
  }
  #day-nav button {
    flex-shrink: 0; background: none;
    border: 1px solid var(--line); border-radius: 20px;
    padding: 5px 12px; font-size: 13px; color: var(--muted);
    cursor: pointer; white-space: nowrap; font-family: var(--font);
  }
  #day-nav button.active {
    background: var(--sage); border-color: var(--sage);
    color: var(--white); font-weight: 600;
  }
  #btn-new-day {
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--sage-light) !important;
    border-color: var(--sage-light) !important;
    color: var(--sage) !important; font-weight: 600 !important;
  }
  main { padding: 16px; max-width: 680px; margin: 0 auto; }
  .day-header {
    background: var(--white); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .day-header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--sage);
  }
  .btn-delete-day {
    background: none; border: none; color: var(--red);
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: var(--font); padding: 4px 8px;
    border: 1px solid var(--red); border-radius: 6px;
  }
  .day-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .day-fields .full { grid-column: 1 / -1; }
  .field-group label {
    display: block; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.4px; margin-bottom: 4px;
  }
  .field-group input[type=date],
  .field-group input[type=text],
  .field-group select {
    width: 100%; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font-size: 15px;
    font-family: var(--font); color: var(--ink);
    -webkit-appearance: none;
  }
  .field-group input:focus,
  .field-group select:focus { outline: none; border-color: var(--sage); }
  .sleep-select { position: relative; }
  .sleep-select::after {
    content: '▾'; position: absolute; right: 10px;
    top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; font-size: 13px;
  }
  .sleep-select select { padding-right: 28px; }
  .meal-card {
    background: var(--white); border: 1px solid var(--line);
    border-radius: var(--radius); margin-bottom: 12px; overflow: hidden;
  }
  .meal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--sage-light);
    border-bottom: 1px solid var(--sage-mid);
  }
  .meal-number {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px; color: var(--sage);
  }
  .btn-remove-meal {
    background: none; border: none; color: var(--red);
    font-size: 20px; cursor: pointer; line-height: 1; padding: 0 2px;
  }
  .meal-body { padding: 14px 14px; display: flex; flex-direction: column; gap: 12px; }
  .sliders-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slider-wrap { display: flex; flex-direction: column; gap: 5px; }
  .slider-wrap label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.4px;
    display: flex; flex-direction: column;
  }
  .slider-hint {
    font-size: 10px; font-weight: 400; color: var(--sage);
    text-transform: none; letter-spacing: 0; font-style: italic;
    display: block; margin-top: 1px;
  }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row input[type=range] {
    flex: 1; -webkit-appearance: none;
    height: 4px; background: var(--line); border-radius: 2px; outline: none;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    border-radius: 50%; background: var(--sage); cursor: pointer;
    border: 2px solid var(--white); box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .slider-val {
    font-size: 16px; font-weight: 700; color: var(--sage);
    width: 22px; text-align: center; flex-shrink: 0;
  }
  textarea {
    width: 100%; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font-size: 15px;
    font-family: var(--font); color: var(--ink);
    resize: vertical; min-height: 58px;
  }
  textarea:focus { outline: none; border-color: var(--sage); }
  textarea::placeholder { color: var(--muted); }
  .divider-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--muted);
    border-bottom: 1px solid var(--line); padding-bottom: 4px;
  }
  .btn-add-meal {
    width: 100%; background: var(--white);
    border: 1.5px dashed var(--sage); border-radius: var(--radius);
    padding: 14px; font-size: 15px; font-weight: 600; color: var(--sage);
    cursor: pointer; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: var(--font);
  }
  .btn-add-meal:active { background: var(--sage-light); }
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white); border-top: 1px solid var(--line);
    padding: 10px 16px 16px;
    display: flex; gap: 8px;
  }
  .btn-save {
    flex: 1; background: var(--sage); color: var(--white);
    border: none; border-radius: var(--radius); padding: 13px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font);
  }
  .btn-save:active { opacity: .85; }
  .btn-menu {
    flex: 0 0 auto; background: var(--white); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 13px 18px; font-size: 20px; line-height: 1;
    cursor: pointer; font-family: var(--font);
  }
  .btn-menu:active { background: var(--bg); }
  .menu-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    z-index: 400; display: flex; align-items: flex-end;
  }
  .menu-overlay.hidden { display: none; }
  .menu-box {
    background: var(--white); width: 100%;
    border-radius: 18px 18px 0 0; padding: 12px 0 32px;
    max-width: 680px; margin: 0 auto;
  }
  .menu-handle {
    width: 36px; height: 4px; background: var(--line);
    border-radius: 2px; margin: 0 auto 16px;
  }
  .menu-title {
    font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 0 20px 8px;
  }
  .menu-item {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 20px; cursor: pointer;
    border: none; background: none; width: 100%;
    font-family: var(--font); font-size: 16px; color: var(--ink);
    text-align: left;
  }
  .menu-item:active { background: var(--bg); }
  .menu-item .menu-icon { font-size: 20px; width: 28px; text-align: center; }
  .menu-item.danger { color: var(--red); }
  .menu-separator {
    height: 1px; background: var(--line); margin: 4px 20px;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 300; display: flex; align-items: flex-end;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--white); width: 100%;
    border-radius: 18px 18px 0 0; padding: 24px 20px 32px;
    max-width: 680px; margin: 0 auto;
  }
  .modal-box h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .modal-box p  { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-cancel {
    flex: 1; background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px; font-size: 15px;
    font-weight: 600; cursor: pointer; font-family: var(--font); color: var(--ink);
  }
  .modal-confirm {
    flex: 1; background: var(--red); border: none;
    border-radius: var(--radius); padding: 13px; font-size: 15px;
    font-weight: 600; cursor: pointer; font-family: var(--font); color: var(--white);
  }
  .pdf-day-list {
    max-height: 260px; overflow-y: auto;
    border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 16px;
  }
  .pdf-day-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .pdf-day-item:last-child { border-bottom: none; }
  .pdf-day-item input[type=checkbox] {
    width: 18px; height: 18px; accent-color: var(--sage); flex-shrink: 0;
  }
  .pdf-day-item label { font-size: 15px; cursor: pointer; }
  .pdf-select-btns { display: flex; gap: 8px; margin-bottom: 12px; }
  .pdf-select-btns button {
    font-size: 12px; font-weight: 600; color: var(--sage);
    background: none; border: 1px solid var(--sage-mid);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: var(--font);
  }
  #toast {
    position: fixed; bottom: 96px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--white);
    font-size: 14px; padding: 9px 18px; border-radius: 20px;
    opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none; white-space: nowrap; z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  #empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  #empty-state p { font-size: 15px; line-height: 1.6; }
  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: white; padding: 0; font-size: 11px; }
    header, #day-nav, .btn-add-meal, .bottom-bar,
    #toast, .btn-remove-meal, .btn-delete-day,
    #empty-state, .modal-overlay { display: none !important; }
    main { padding: 0; max-width: 100%; }
    .print-day-block { page-break-after: always; }
    .print-day-block:last-child { page-break-after: avoid; }
    .day-header {
      background: #e8f0ec !important;
      border: 1px solid #aaa; border-radius: 0;
      margin-bottom: 8px; padding: 10px 12px;
    }
    .day-fields { grid-template-columns: repeat(4, 1fr); }
    .meal-card {
      border: 1px solid #bbb; border-radius: 0;
      margin-bottom: 6px; break-inside: avoid;
    }
    .meal-header { background: #ddeae4 !important; padding: 6px 10px; }
    .meal-body   { padding: 8px 10px; gap: 6px; }
    .sliders-grid { grid-template-columns: repeat(4, 1fr); }
    .slider-row input[type=range] { display: none !important; }
    .slider-val { font-size: 14px; }
    .field-group input, .field-group select, textarea {
      border: none; background: transparent; padding: 2px 0; font-size: 12px;
    }
    textarea { min-height: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Diário Alimentar</h1>
  <p>Método Sophie Deran</p>
</header>

<div id="day-nav">
  <button id="btn-new-day">＋ Novo dia</button>
</div>

<main id="main-content">
  <div id="empty-state">
    <div class="icon">🥗</div>
    <p>Nenhum dia registrado ainda.<br>Toque em <strong>+ Novo dia</strong> para começar.</p>
  </div>
</main>

<div class="bottom-bar">
  <button class="btn-save" id="btn-save">Salvar</button>
  <button class="btn-menu" id="btn-menu">⋯</button>
</div>

<div class="menu-overlay hidden" id="menu-overlay">
  <div class="menu-box">
    <div class="menu-handle"></div>
    <div class="menu-title">Opções</div>
    <button class="menu-item" id="menu-pdf-day">
      <span class="menu-icon">📄</span> PDF do dia atual
    </button>
    <button class="menu-item" id="menu-pdf-all">
      <span class="menu-icon">📋</span> PDF geral (vários dias)
    </button>
    <div class="menu-separator"></div>
    <button class="menu-item" id="menu-export-json">
      <span class="menu-icon">💾</span> Exportar histórico (JSON)
    </button>
    <button class="menu-item" id="menu-import-json">
      <span class="menu-icon">📥</span> Importar histórico (JSON)
    </button>
    <input type="file" id="import-file-input" accept=".json" style="display:none">
    <div class="menu-separator"></div>
    <button class="menu-item danger" id="menu-bulk-delete">
      <span class="menu-icon">🗑</span> Apagar dias em lote
    </button>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-delete">
  <div class="modal-box">
    <h3>Apagar este dia?</h3>
    <p id="modal-delete-msg">Esta ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button class="modal-cancel"  id="modal-delete-cancel">Cancelar</button>
      <button class="modal-confirm" id="modal-delete-confirm">Apagar</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-pdf">
  <div class="modal-box">
    <h3>Selecionar dias para o PDF</h3>
    <div class="pdf-select-btns">
      <button id="pdf-select-all">Todos</button>
      <button id="pdf-select-15">Últimos 15 dias</button>
      <button id="pdf-select-none">Nenhum</button>
    </div>
    <div class="pdf-day-list" id="pdf-day-list"></div>
    <div class="modal-actions">
      <button class="modal-cancel"  id="modal-pdf-cancel">Cancelar</button>
      <button class="modal-confirm" id="modal-pdf-confirm">Gerar PDF</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-bulk-delete">
  <div class="modal-box">
    <h3>Apagar dias</h3>
    <div class="pdf-select-btns">
      <button id="bulk-select-all">Todos</button>
      <button id="bulk-select-none">Nenhum</button>
    </div>
    <div class="pdf-day-list" id="bulk-day-list"></div>
    <p style="font-size:13px;color:var(--red);margin-top:12px">⚠️ Esta ação não pode ser desfeita.</p>
    <div class="modal-actions" style="margin-top:12px">
      <button class="modal-cancel"  id="modal-bulk-cancel">Cancelar</button>
      <button class="modal-confirm" id="modal-bulk-confirm">Apagar selecionados</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'diario-alimentar-v2';
let state = { days: [], activeDayId: null };

function load() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) state = JSON.parse(r); } catch(e){}
}
function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  toast('Salvo ✓');
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function weekdayOf(iso) {
  if (!iso) return '';
  const days = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const [y,m,d] = iso.split('-').map(Number);
  return days[new Date(y, m-1, d).getDay()];
}
function fmtDate(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function activeDay() { return state.days.find(d => d.id === state.activeDayId) || null; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function sliderHTML(cls, label, val, hint) {
  return `
    <div class="slider-wrap">
      <label>${label}${hint ? `<span class="slider-hint">${hint}</span>` : ''}</label>
      <div class="slider-row">
        <input type="range" class="${cls}" min="1" max="10" step="1" value="${val}">
        <span class="slider-val">${val}</span>
      </div>
    </div>`;
}

function renderNav() {
  const nav = document.getElementById('day-nav');
  const btnNewDay = document.getElementById('btn-new-day');
  nav.querySelectorAll('.day-btn').forEach(b => b.remove());
  let anchor = btnNewDay;
  [...state.days]
    .sort((a,b) => b.date.localeCompare(a.date))
    .forEach(day => {
      const btn = document.createElement('button');
      btn.className = 'day-btn' + (day.id === state.activeDayId ? ' active' : '');
      btn.textContent = fmtDate(day.date);
      btn.dataset.id = day.id;
      btn.addEventListener('click', () => {
        readForm();
        state.activeDayId = day.id;
        renderAll();
      });
      nav.insertBefore(btn, anchor.nextSibling);
      anchor = btn;
    });
}

function readForm() {
  const day = activeDay(); if (!day) return;
  day.date     = document.getElementById('f-date')?.value     || day.date;
  day.weekday  = weekdayOf(day.date);
  day.activity = document.getElementById('f-activity')?.value || '';
  day.sleep    = document.getElementById('f-sleep')?.value    || '';
  day.meals = [];
  document.querySelectorAll('.meal-card').forEach(card => {
    day.meals.push({
      id:        card.dataset.mealId,
      time:      card.querySelector('.m-time')?.value     || '',
      hunger:    card.querySelector('.m-hunger')?.value   || '5',
      foods:     card.querySelector('.m-foods')?.value    || '',
      satiation: card.querySelector('.m-satiation')?.value|| '5',
      satiety:   card.querySelector('.m-satiety')?.value  || '5',
      satisf:    card.querySelector('.m-satisf')?.value   || '5',
      where:     card.querySelector('.m-where')?.value    || '',
      notes:     card.querySelector('.m-notes')?.value    || '',
    });
  });
}

function renderAll() { renderNav(); renderDay(); }

function renderDay() {
  const main = document.getElementById('main-content');
  const day  = activeDay();
  if (!day) {
    main.innerHTML = `<div id="empty-state"><div class="icon">🥗</div><p>Nenhum dia registrado ainda.<br>Toque em <strong>+ Novo dia</strong> para começar.</p></div>`;
    return;
  }
  main.innerHTML = '';

  const hdr = document.createElement('div');
  hdr.className = 'day-header';
  hdr.innerHTML = `
    <div class="day-header-top">
      <span class="section-label">Informações do dia</span>
      <button class="btn-delete-day" id="btn-delete-day">🗑 Apagar dia</button>
    </div>
    <div class="day-fields">
      <div class="field-group">
        <label>Data</label>
        <input type="date" id="f-date" value="${day.date}">
      </div>
      <div class="field-group">
        <label>Dia da semana</label>
        <input type="text" id="f-weekday" value="${day.weekday}" readonly style="color:var(--muted)">
      </div>
      <div class="field-group full">
        <label>Atividade física</label>
        <input type="text" id="f-activity" placeholder="Ex: caminhada 30 min" value="${day.activity}">
      </div>
      <div class="field-group full">
        <label>Sono</label>
        <div class="sleep-select">
          <select id="f-sleep">
            <option value="">Selecione…</option>
            <option value="Excelente" ${day.sleep==='Excelente'?'selected':''}>😴 Excelente</option>
            <option value="Bom"       ${day.sleep==='Bom'      ?'selected':''}>🙂 Bom</option>
            <option value="Regular"   ${day.sleep==='Regular'  ?'selected':''}>😐 Regular</option>
            <option value="Ruim"      ${day.sleep==='Ruim'     ?'selected':''}>😣 Ruim</option>
          </select>
        </div>
      </div>
    </div>`;
  hdr.querySelector('#f-date').addEventListener('change', e => {
    hdr.querySelector('#f-weekday').value = weekdayOf(e.target.value);
  });
  hdr.querySelector('#btn-delete-day').addEventListener('click', () => {
    openDeleteModal(day);
  });
  main.appendChild(hdr);

  day.meals.forEach(meal => main.appendChild(buildMealCard(meal)));

  const btnAdd = document.createElement('button');
  btnAdd.className = 'btn-add-meal';
  btnAdd.innerHTML = '＋ Adicionar refeição';
  btnAdd.addEventListener('click', () => {
    readForm();
    activeDay().meals.push({ id:uid(), time:'', hunger:'5', foods:'', satiation:'5', satiety:'5', satisf:'5', where:'', notes:'' });
    renderDay();
    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' }), 50);
  });
  main.appendChild(btnAdd);
}

function buildMealCard(meal) {
  const allCards = document.querySelectorAll('.meal-card').length;
  const card = document.createElement('div');
  card.className = 'meal-card';
  card.dataset.mealId = meal.id;
  card.innerHTML = `
    <div class="meal-header">
      <span class="meal-number">Refeição ${allCards + 1}</span>
      <button class="btn-remove-meal" title="Remover refeição">×</button>
    </div>
    <div class="meal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field-group">
          <label>Horário</label>
          <input type="time" class="m-time" value="${meal.time}">
        </div>
        <div></div>
      </div>
      <div class="divider-label">Antes da refeição</div>
      <div class="sliders-grid" style="grid-template-columns:1fr">
        ${sliderHTML('m-hunger','Fome (1–10)', meal.hunger)}
      </div>
      <div class="field-group">
        <label>Alimentos e quantidade</label>
        <textarea class="m-foods" rows="3" placeholder="Ex: arroz 4 colheres, frango 100g, salada à vontade">${meal.foods}</textarea>
      </div>
      <div class="field-group">
        <label>Onde / Com quem</label>
        <input type="text" class="m-where" placeholder="Ex: em casa, sozinha" value="${meal.where}">
      </div>
      <div class="divider-label">Durante a refeição</div>
      <div class="sliders-grid" style="grid-template-columns:1fr">
        ${sliderHTML('m-satiation','Saciação (1–10)', meal.satiation,'O que me fez parar de comer')}
      </div>
      <div class="divider-label">Depois da refeição</div>
      <div class="sliders-grid">
        ${sliderHTML('m-satiety','Saciedade (1–10)', meal.satiety,'Ausência de fome após a refeição')}
        ${sliderHTML('m-satisf', 'Satisfação (1–10)', meal.satisf, 'Satisfação emocional?')}
      </div>
      <div class="field-group">
        <label>Observações</label>
        <textarea class="m-notes" rows="2" placeholder="Emoções, contexto, vontades…">${meal.notes}</textarea>
      </div>
    </div>`;

  card.querySelectorAll('input[type=range]').forEach(slider => {
    slider.addEventListener('input', e => {
      e.target.closest('.slider-row').querySelector('.slider-val').textContent = e.target.value;
    });
  });
  card.querySelector('.btn-remove-meal').addEventListener('click', () => {
    readForm();
    activeDay().meals = activeDay().meals.filter(m => m.id !== meal.id);
    renderDay();
  });
  return card;
}

function renderDayForPrint(day) {
  const wrap = document.createElement('div');
  wrap.className = 'print-day-block';

  const hdr = document.createElement('div');
  hdr.className = 'day-header';
  hdr.innerHTML = `
    <div class="section-label" style="margin-bottom:8px">
      ${fmtDate(day.date)} — ${day.weekday}
    </div>
    <div class="day-fields">
      <div class="field-group"><label>Atividade física</label>
        <input type="text" value="${day.activity}" readonly></div>
      <div class="field-group"><label>Sono</label>
        <input type="text" value="${day.sleep}" readonly></div>
    </div>`;
  wrap.appendChild(hdr);

  day.meals.forEach((meal, i) => {
    const card = document.createElement('div');
    card.className = 'meal-card';
    card.innerHTML = `
      <div class="meal-header"><span class="meal-number">Refeição ${i+1} — ${meal.time}</span></div>
      <div class="meal-body">
        <div class="sliders-grid" style="grid-template-columns:repeat(4,1fr)">
          <div class="slider-wrap"><label>Fome<br><span class="slider-val">${meal.hunger}</span></label></div>
          <div class="slider-wrap"><label>Saciação<br><span class="slider-val">${meal.satiation}</span></label></div>
          <div class="slider-wrap"><label>Saciedade<br><span class="slider-val">${meal.satiety}</span></label></div>
          <div class="slider-wrap"><label>Satisfação<br><span class="slider-val">${meal.satisf}</span></label></div>
        </div>
        <div class="field-group"><label>Alimentos e quantidade</label>
          <textarea readonly rows="2">${meal.foods}</textarea></div>
        <div class="field-group"><label>Onde / Com quem</label>
          <input type="text" value="${meal.where}" readonly></div>
        <div class="field-group"><label>Observações</label>
          <textarea readonly rows="2">${meal.notes}</textarea></div>
      </div>`;
    wrap.appendChild(card);
  });
  return wrap;
}

function openDeleteModal(day) {
  document.getElementById('modal-delete-msg').textContent =
    `Apagar ${fmtDate(day.date)} (${day.weekday})? Esta ação não pode ser desfeita.`;
  document.getElementById('modal-delete').classList.remove('hidden');
  document.getElementById('modal-delete-confirm').onclick = () => {
    state.days = state.days.filter(d => d.id !== day.id);
    state.activeDayId = state.days.length > 0 ? state.days[state.days.length-1].id : null;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    document.getElementById('modal-delete').classList.add('hidden');
    toast('Dia apagado');
    renderAll();
  };
}
document.getElementById('modal-delete-cancel').addEventListener('click', () => {
  document.getElementById('modal-delete').classList.add('hidden');
});
document.getElementById('modal-delete').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-delete'))
    document.getElementById('modal-delete').classList.add('hidden');
});

function openPdfAllModal() {
  if (state.days.length === 0) { toast('Nenhum dia registrado'); return; }
  readForm();

  const sorted = [...state.days].sort((a,b) => a.date.localeCompare(b.date));
  const list   = document.getElementById('pdf-day-list');
  list.innerHTML = '';
  sorted.forEach(day => {
    const item = document.createElement('div');
    item.className = 'pdf-day-item';
    item.innerHTML = `
      <input type="checkbox" id="chk-${day.id}" data-id="${day.id}" checked>
      <label for="chk-${day.id}">${fmtDate(day.date)} — ${day.weekday}</label>`;
    list.appendChild(item);
  });
  document.getElementById('modal-pdf').classList.remove('hidden');
}

document.getElementById('pdf-select-all').addEventListener('click', () => {
  document.querySelectorAll('#pdf-day-list input[type=checkbox]').forEach(c => c.checked = true);
});
document.getElementById('pdf-select-none').addEventListener('click', () => {
  document.querySelectorAll('#pdf-day-list input[type=checkbox]').forEach(c => c.checked = false);
});
document.getElementById('pdf-select-15').addEventListener('click', () => {
  const checks = [...document.querySelectorAll('#pdf-day-list input[type=checkbox]')];
  const sorted = [...state.days].sort((a,b) => b.date.localeCompare(a.date));
  const last15ids = new Set(sorted.slice(0,15).map(d => d.id));
  checks.forEach(c => { c.checked = last15ids.has(c.dataset.id); });
});

document.getElementById('modal-pdf-cancel').addEventListener('click', () => {
  document.getElementById('modal-pdf').classList.add('hidden');
});
document.getElementById('modal-pdf').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-pdf'))
    document.getElementById('modal-pdf').classList.add('hidden');
});

document.getElementById('modal-pdf-confirm').addEventListener('click', () => {
  const selectedIds = [...document.querySelectorAll('#pdf-day-list input[type=checkbox]:checked')]
    .map(c => c.dataset.id);
  if (selectedIds.length === 0) { toast('Selecione ao menos um dia'); return; }

  const selectedDays = state.days
    .filter(d => selectedIds.includes(d.id))
    .sort((a,b) => a.date.localeCompare(b.date));

  const main = document.getElementById('main-content');
  const backup = main.innerHTML;
  main.innerHTML = '';
  selectedDays.forEach(day => main.appendChild(renderDayForPrint(day)));

  document.getElementById('modal-pdf').classList.add('hidden');

  setTimeout(() => {
    window.print();
    setTimeout(() => { main.innerHTML = backup; renderDay(); }, 500);
  }, 200);
});

function openBulkDeleteModal() {
  if (state.days.length === 0) { toast('Nenhum dia registrado'); return; }
  readForm();
  const sorted = [...state.days].sort((a,b) => b.date.localeCompare(a.date));
  const list = document.getElementById('bulk-day-list');
  list.innerHTML = '';
  sorted.forEach(day => {
    const item = document.createElement('div');
    item.className = 'pdf-day-item';
    item.innerHTML = `
      <input type="checkbox" id="bchk-${day.id}" data-id="${day.id}">
      <label for="bchk-${day.id}">${fmtDate(day.date)} — ${day.weekday}</label>`;
    list.appendChild(item);
  });
  document.getElementById('modal-bulk-delete').classList.remove('hidden');
}
document.getElementById('bulk-select-all').addEventListener('click', () => {
  document.querySelectorAll('#bulk-day-list input[type=checkbox]').forEach(c => c.checked = true);
});
document.getElementById('bulk-select-none').addEventListener('click', () => {
  document.querySelectorAll('#bulk-day-list input[type=checkbox]').forEach(c => c.checked = false);
});
document.getElementById('modal-bulk-cancel').addEventListener('click', () => {
  document.getElementById('modal-bulk-delete').classList.add('hidden');
});
document.getElementById('modal-bulk-delete').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-bulk-delete'))
    document.getElementById('modal-bulk-delete').classList.add('hidden');
});
document.getElementById('modal-bulk-confirm').addEventListener('click', () => {
  const toDelete = new Set(
    [...document.querySelectorAll('#bulk-day-list input[type=checkbox]:checked')]
      .map(c => c.dataset.id)
  );
  if (toDelete.size === 0) { toast('Selecione ao menos um dia'); return; }
  state.days = state.days.filter(d => !toDelete.has(d.id));
  if (!state.days.find(d => d.id === state.activeDayId))
    state.activeDayId = state.days.length > 0 ? state.days[0].id : null;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  document.getElementById('modal-bulk-delete').classList.add('hidden');
  toast(`${toDelete.size} dia(s) apagado(s)`);
  renderAll();
});

document.getElementById('btn-new-day').addEventListener('click', () => {
  readForm();
  const iso = todayISO();
  const d = { id: uid(), date: iso, weekday: weekdayOf(iso), activity:'', sleep:'', meals:[] };
  state.days.push(d);
  state.activeDayId = d.id;
  renderAll();
});

document.getElementById('btn-save').addEventListener('click', () => {
  if (!activeDay()) { toast('Crie um dia primeiro'); return; }
  readForm(); persist(); renderNav();
});

function exportPdfDay() {
  if (!activeDay()) { toast('Nenhum dia para exportar'); return; }
  readForm(); persist();
  window.print();
}

const menuOverlay = document.getElementById('menu-overlay');
document.getElementById('btn-menu').addEventListener('click', () => {
  menuOverlay.classList.remove('hidden');
});
menuOverlay.addEventListener('click', e => {
  if (e.target === menuOverlay) menuOverlay.classList.add('hidden');
});
function closeMenu() { menuOverlay.classList.add('hidden'); }

document.getElementById('menu-pdf-day').addEventListener('click', () => {
  closeMenu(); exportPdfDay();
});
document.getElementById('menu-pdf-all').addEventListener('click', () => {
  closeMenu(); openPdfAllModal();
});
document.getElementById('menu-bulk-delete').addEventListener('click', () => {
  closeMenu(); openBulkDeleteModal();
});

document.getElementById('menu-export-json').addEventListener('click', () => {
  closeMenu();
  readForm();
  const json = JSON.stringify(state, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    toast('Histórico copiado! Cole num bloco de notas e salve como .json');
  }).catch(() => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;padding:20px';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:14px;padding:20px;width:100%">
        <p style="font-size:13px;color:#6C6C70;margin-bottom:8px">Selecione tudo e copie:</p>
        <textarea readonly rows="8" style="width:100%;font-size:11px;border:1px solid #ddd;border-radius:6px;padding:8px;font-family:monospace">${json}</textarea>
        <button onclick="this.closest('div').parentElement.remove()" style="margin-top:12px;width:100%;padding:12px;background:#4E7F6B;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600">Fechar</button>
      </div>`;
    document.body.appendChild(overlay);
  });
});

document.getElementById('menu-import-json').addEventListener('click', () => {
  closeMenu();
  document.getElementById('import-file-input').click();
});
document.getElementById('import-file-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.days) throw new Error('Formato inválido');
      const existingIds = new Set(state.days.map(d => d.id));
      let added = 0;
      imported.days.forEach(d => {
        if (!existingIds.has(d.id)) { state.days.push(d); added++; }
      });
      if (!state.activeDayId && state.days.length > 0)
        state.activeDayId = state.days[0].id;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      toast(`${added} dia(s) importado(s) ✓`);
      renderAll();
    } catch(err) {
      toast('Arquivo inválido ✗');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

load();
if (state.days.length > 0 && !state.activeDayId)
  state.activeDayId = state.days[state.days.length - 1].id;
renderAll();
</script>
</body>
</html>
